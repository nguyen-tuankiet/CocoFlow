name: Build and release

# Every push or merge to main that changes the app builds both installers and publishes a GitHub Release.
# The version is "<major>.<minor>" from src-tauri/tauri.conf.json plus the run number, e.g. 0.4.17, so nothing has to be
# bumped by hand. Changes that only touch website/ do not build installers (Vercel redeploys the site on its own).
#
# One-time setup: publish the "tools-v1" pre-release made with scripts/pack-tools.ps1
# (ffmpeg, Pandoc, ImageMagick, Ghostscript, 7-Zip, the AI models and LibreOffice are too big for git).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "branding/**"
      - "scripts/**"
      - "index.html"
      - "wheel.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  TOOLS_TAG: tools-v1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $parts = $conf.version.Split('.')
          $version = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "Building $version"

  # The two installers are independent and NSIS spends most of the time compressing, so they build side by side.
  build:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      matrix:
        variant: [standard, full]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: ${{ matrix.variant == 'standard' }}

      - name: Write the version into the build files
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          (Get-Content src-tauri/tauri.conf.json -Raw) -replace '"version":\s*"[^"]+"', "`"version`": `"$version`"" | Set-Content src-tauri/tauri.conf.json -NoNewline
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "[^"]+"', "version = `"$version`"" | Set-Content src-tauri/Cargo.toml -NoNewline

      - name: Download the build tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force tools, installer-bin, installer-extra | Out-Null
          $files = @('tools-core.zip', 'tools-ai.zip')
          if ('${{ matrix.variant }}' -eq 'full') { $files += 'libreoffice.7z' }
          foreach ($f in $files) {
            gh release download $env:TOOLS_TAG --repo $env:GITHUB_REPOSITORY --dir tools --pattern $f
            if ($LASTEXITCODE -ne 0) { throw "Could not download $f from release '$env:TOOLS_TAG'. Publish it first (see scripts/pack-tools.ps1)." }
          }
          7z x tools/tools-core.zip -oinstaller-bin -y -bso0
          7z x tools/tools-ai.zip -oinstaller-bin -y -bso0
          if (Test-Path tools/libreoffice.7z) { Move-Item tools/libreoffice.7z installer-extra/libreoffice.7z }
          Remove-Item tools -Recurse -Force

      - run: npm ci

      - name: Build the installer
        shell: pwsh
        run: ./scripts/make-release.ps1 -SkipPortable -Variant ${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.variant }}
          path: release/*.exe
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cocoflow $v" --generate-notes \
            "release/Cocoflow_${v}_x64-setup.exe" "release/Cocoflow_${v}_x64-full-setup.exe"
